name: HCCoreAPI
description: $description
prefix: HCCore-API
version: '${version}'

main: com.hackclub.hccoreapi.HCCoreAPI
api-version: '1.21.11'
load: POSTWORLD
depend: [ HCCore ]

authors: [ Nova, Hack Club ]
website: https://hackclub.com/minecraft

commands:
  webapi:
    description: Manage the HCCore Web API!
    aliases:
      - hccapi
      - coreapi
      - api

permissions:
  hccoreapi.manage:
    description: Allows managing the web API.
    default: op